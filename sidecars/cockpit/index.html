<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="cockpit-csrf" content="__CSRF_TOKEN__" />
<title>AGY Cockpit</title>
<link rel="stylesheet" href="/static/dispatch_drawer.css?v=__UI_VERSION__" />
<script defer src="/static/dispatch_drawer.catalog.js?v=__UI_VERSION__"></script>
<script defer src="/static/dispatch_drawer.js?v=__UI_VERSION__"></script>
<style>
  :root {
    --bg: #141617;
    --card: color-mix(in srgb, #ffffff 5.5%, var(--bg));
    --card-hi: color-mix(in srgb, #ffffff 9%, var(--bg));
    --popover-bg: color-mix(in srgb, #dce8f8 12%, var(--bg));
    --popover-border: color-mix(in srgb, var(--text) 24%, var(--card));
    --popover-cell: color-mix(in srgb, #000000 22%, var(--popover-bg));
    --popover-shadow: 0 12px 32px rgba(0, 0, 0, 0.68), 0 0 0 1px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.07);
    --border: color-mix(in srgb, var(--text) 12%, var(--card));
    --divider: color-mix(in srgb, var(--text) 6%, transparent);
    --pill-bg: color-mix(in srgb, var(--text) 7%, transparent);
    --track-bg: color-mix(in srgb, #000000 38%, var(--bg));
    --foot-bg: color-mix(in srgb, var(--bg) 92%, transparent);
    --text: #eef2f6;
    --muted: color-mix(in srgb, var(--text) 62%, var(--bg));
    --dim: color-mix(in srgb, var(--text) 42%, var(--bg));
    --cyan: #6cb6ff;
    --cyan-text: color-mix(in srgb, var(--cyan) 62%, #ffffff);
    --badge-bg: color-mix(in srgb, var(--cyan) 14%, transparent);
    --badge-border: color-mix(in srgb, var(--cyan) 30%, transparent);
    --spin-track: color-mix(in srgb, var(--cyan) 25%, transparent);
    --blue: #4c9aff;
    --green: #4cc86b;
    --yellow: #f5cd47;
    --orange: #fea362;
    --red: #f87168;
    --brand-gemini: #4c9aff;
    --brand-claude: #d97757;
    --brand-codex: #10a37f;
    --brand-droid: #a78bfa;
    --brand-grok: #f472b6;
    --ring-track: var(--track-bg);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow-x: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
    font-size: 11.5px;
    line-height: 1.35;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  .wrap {
    min-height: 100%;
    height: 100%;
    padding: 8px 8px 34px;
    display: flex;
    flex-direction: column;
    gap: 7px;
    overflow-y: auto;
  }
  .wrap > .hero-grid,
  .wrap > .turns-box {
    flex-shrink: 0;
  }
  #subBox:not([open]) > .sub-box-body {
    display: none;
  }
  #subBox[open] {
    flex: 1 1 120px;
    min-height: 120px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #subBox[open] > .sub-box-summary {
    flex-shrink: 0;
  }
  #subBox[open] > .sub-box-body {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #subBox[open] .sub-list {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    padding-right: 1px;
  }
  .wrap::-webkit-scrollbar,
  #subBox[open] .sub-list::-webkit-scrollbar,
  .mb-chart.mb-chart--scroll::-webkit-scrollbar {
    width: 4px;
    height: 4px;
  }
  .wrap::-webkit-scrollbar-track,
  #subBox[open] .sub-list::-webkit-scrollbar-track,
  .mb-chart.mb-chart--scroll::-webkit-scrollbar-track {
    background: transparent;
  }
  .wrap::-webkit-scrollbar-thumb,
  #subBox[open] .sub-list::-webkit-scrollbar-thumb,
  .mb-chart.mb-chart--scroll::-webkit-scrollbar-thumb {
    background: transparent;
    border-radius: 999px;
  }
  .wrap:hover::-webkit-scrollbar-thumb,
  #subBox[open] .sub-list:hover::-webkit-scrollbar-thumb,
  .mb-chart.mb-chart--scroll:hover::-webkit-scrollbar-thumb {
    background: color-mix(in srgb, var(--text) 16%, transparent);
  }
  .wrap::-webkit-scrollbar-thumb:hover,
  #subBox[open] .sub-list::-webkit-scrollbar-thumb:hover,
  .mb-chart.mb-chart--scroll::-webkit-scrollbar-thumb:hover {
    background: color-mix(in srgb, var(--text) 30%, transparent);
  }
  .mono {
    font-family: "SF Mono", "JetBrains Mono", Menlo, monospace;
    font-variant-numeric: tabular-nums;
  }
  .c-text { color: var(--text); font-weight: 700; }
  .c-cyan { color: var(--cyan-text); }
  .c-blue { color: var(--blue); }
  .c-green { color: var(--green); }
  .c-yellow { color: var(--yellow); }
  .c-orange { color: var(--orange); }
  .c-red { color: var(--red); }
  .c-muted { color: var(--muted); }
  .c-dim { color: var(--dim); }

  /* Layer 1: Header Bar */
  .hdr {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 8px;
  }
  .hdr-main {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .conv-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .model-badge {
    flex-shrink: 0;
    font-size: 10px;
    font-weight: 600;
    color: var(--cyan);
    background: var(--badge-bg);
    border: 1px solid var(--badge-border);
    padding: 1px 6px;
    border-radius: 999px;
  }
  .hdr-sub {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    margin-top: 5px;
    padding-top: 4px;
    border-top: 1px solid var(--divider);
    font-size: 10px;
  }
  .cache-ttl {
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Layer 2: 2x2 Hero KPI Grid (Core Glanceable Metrics) */
  .hero-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .kpi-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 8px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-width: 0;
  }
  .kpi-card.has-ring {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
  }
  .kpi-main {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-width: 0;
    flex: 1;
  }
  .kpi-ring {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
    transform: scaleX(-1) rotate(-90deg);
  }
  .ring-track {
    fill: none;
    stroke: var(--track-bg);
    stroke-width: 4;
  }
  .ring-fill {
    fill: none;
    stroke: currentColor;
    stroke-width: 4;
    stroke-linecap: round;
    transition: stroke-dasharray 0.25s ease;
  }
  .kpi-spark {
    width: 24px;
    height: 26px;
    margin-right: 5px;
    flex-shrink: 0;
    overflow: visible;
  }
  .spark-empty {
    fill: var(--track-bg);
  }
  .spark-hist {
    fill: color-mix(in srgb, var(--text) 28%, var(--track-bg));
  }
  .spark-curr {
    fill: currentColor;
  }
  .kpi-label {
    font-size: 10px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.2px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 2px;
  }
  .kpi-val {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: -0.4px;
    margin: 1px 0 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* Layer 3: 2-Card Token Breakdown (Same layout & ring style as Hero KPI cards) */
  .tk-ring-card {
    cursor: default;
    transition: border-color 0.12s ease;
  }
  .tk-ring-card:hover,
  .tk-ring-card:focus-visible {
    border-color: var(--badge-border);
    outline: none;
  }
  .tk-cost {
    font-size: 9.5px;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
  }
  .kpi-unit {
    font-size: 10.5px;
    font-weight: 500;
    color: var(--muted);
    margin-left: 2px;
  }
  .kpi-sub {
    font-size: 10px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .kpi-sub strong {
    color: var(--text);
    font-weight: 600;
  }

  /* Layer 3: Token Breakdown Card */
  .section-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 8px;
  }
  .tk-table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  .tk-table th {
    font-size: 10px;
    color: var(--muted);
    font-weight: 600;
    padding: 0 2px 5px;
    border-bottom: 1px solid var(--border);
    text-align: right;
    white-space: nowrap;
  }
  .tk-table th:first-child {
    text-align: left;
    width: 31%;
  }
  .tk-table th:nth-child(2) { width: 23%; }
  .tk-table th:nth-child(3) { width: 24%; }
  .tk-table th:nth-child(4) { width: 22%; }
  .tk-table td {
    padding: 3.5px 2px;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .row-primary td {
    padding-top: 6px;
    font-size: 12px;
    font-weight: 700;
    color: var(--text);
  }
  .row-primary td:first-child {
    text-align: left;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 11px;
    font-weight: 600;
    color: var(--text);
  }
  .row-child td {
    font-size: 11px;
    color: var(--muted);
    padding-top: 1.5px;
    padding-bottom: 2px;
  }
  .row-child td:first-child {
    text-align: left;
    padding-left: 8px;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 10.5px;
    color: var(--muted);
  }
  .row-divider td {
    border-bottom: 1px solid var(--border);
    padding-bottom: 5px;
  }

  /* Layer 4: Collapsible Boxes */
  .turns-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 8px;
  }
  details.turns-box summary,
  .turns-box > .sub-box-summary {
    cursor: pointer;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 2px 4px;
    list-style: none;
    user-select: none;
  }
  details.turns-box summary::-webkit-details-marker { display: none; }
  details.turns-box summary:hover,
  .turns-box > .sub-box-summary:hover { color: var(--text); }
  details.turns-box > summary > span:first-child,
  .turns-box > .sub-box-summary > span:first-child {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }
  details.turns-box > summary > span:first-child::before,
  .turns-box > .sub-box-summary > span:first-child::before {
    content: "▸";
    display: inline-block;
    font-size: 10px;
    line-height: 1;
    color: var(--dim);
    transition: transform 0.14s ease, color 0.14s ease;
  }
  details.turns-box[open] > summary > span:first-child::before,
  .turns-box[open] > .sub-box-summary > span:first-child::before {
    transform: rotate(90deg);
    color: var(--muted);
  }
  details.turns-box > summary:hover > span:first-child::before,
  .turns-box > .sub-box-summary:hover > span:first-child::before {
    color: var(--text);
  }
  #subBadge, #calBadge {
    font-size: 9.5px;
    letter-spacing: -0.2px;
    white-space: nowrap;
  }
  .cal-tabs {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    margin-left: auto;
    padding: 1px;
    background: var(--pill-bg);
    border: 1px solid var(--border);
    border-radius: 5px;
  }
  .cal-tab {
    font-family: inherit;
    font-size: 9.5px;
    font-weight: 600;
    line-height: 1.2;
    color: var(--muted);
    background: transparent;
    border: 1px solid transparent;
    padding: 1px 5px;
    border-radius: 3.5px;
    cursor: pointer;
    user-select: none;
    transition: color 0.12s ease, background-color 0.12s ease, border-color 0.12s ease;
  }
  .cal-tab:hover {
    color: var(--text);
    background: var(--bg-hover, var(--card-hi));
  }
  .cal-tab.active {
    color: var(--cyan-text);
    background: var(--badge-bg);
    border-color: var(--badge-border);
  }
  .cal-tab:focus-visible {
    outline: 1.5px solid var(--cyan);
    outline-offset: 1px;
  }
  .cal-panel {
    margin-top: 5px;
    width: 100%;
    overflow: hidden;
  }
  .cal-chart {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    padding: 4px 2px 5px;
    border-bottom: 1px solid var(--divider);
  }
  .cal-chart.cal-chart--collapsed {
    border-bottom: none;
    padding-bottom: 2px;
  }
  .cal-chart.cal-chart--collapsed .cal-bar-col:not(.is-zero) .cal-bar-fill {
    background: color-mix(in srgb, var(--cyan) 44%, var(--card));
    box-shadow: none;
  }
  .cal-chart.cal-chart--collapsed .cal-bar-col:not(.is-zero):hover .cal-bar-fill {
    background: color-mix(in srgb, var(--cyan) 64%, var(--card));
  }
  .cal-chart.cal-chart--collapsed .cal-bar-col.is-current:not(.is-zero) .cal-bar-fill {
    background: color-mix(in srgb, var(--blue) 88%, var(--card));
  }
  .cal-chart.cal-chart--collapsed .cal-bar-col.is-current:not(.is-zero):hover .cal-bar-fill {
    background: var(--blue);
  }
  .cal-chart.cal-chart--collapsed .cal-bar-col.is-current .cal-bar-lbl {
    color: var(--text);
    font-weight: 600;
  }
  .cal-chart.cal-chart--collapsed .cal-bar-col:not(.is-zero) .cal-bar-tok {
    color: var(--text);
    font-weight: 600;
  }
  .cal-chart.cal-chart--collapsed .cal-bar-col:not(.is-zero) .cal-bar-usd {
    color: var(--muted);
  }
  .cal-chart.cal-chart--collapsed .cal-bar-col:not(.is-zero) .cal-bar-lbl {
    color: var(--muted);
  }
  .cal-chart.cal-chart--collapsed .cal-bar-col:not(.is-zero):hover .cal-bar-lbl {
    color: var(--text);
  }
  .cal-chart.cal-chart--month {
    gap: 2px;
    padding: 4px 1px 5px;
  }
  .cal-chart.cal-chart--month.cal-chart--collapsed {
    padding-bottom: 2px;
  }
  .cal-bar-col {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 2px 0;
    margin: 0;
    background: transparent;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    color: inherit;
    transition: background-color 0.12s ease;
  }
  .cal-bar-col:hover {
    background: var(--pill-bg);
  }
  .cal-bar-col:focus-visible {
    outline: 1.5px solid var(--cyan);
    outline-offset: 1px;
  }
  .cal-bar-val {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 1px;
    height: 20px;
    max-width: 100%;
    overflow: hidden;
  }
  .cal-bar-tok, .cal-bar-usd {
    display: block;
    line-height: 1.05;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .cal-bar-tok {
    font-size: 8.5px;
    color: var(--muted);
  }
  .cal-bar-usd {
    font-size: 8px;
    color: var(--dim);
  }
  .cal-chart--month .cal-bar-col.is-selected .cal-bar-val,
  .cal-chart--month .cal-bar-col.is-selected .cal-bar-tok,
  .cal-chart--month .cal-bar-col.is-selected .cal-bar-usd,
  .cal-chart--month .cal-bar-col.is-month-anchor .cal-bar-val,
  .cal-chart--month .cal-bar-col.is-month-anchor .cal-bar-tok,
  .cal-chart--month .cal-bar-col.is-month-anchor .cal-bar-usd {
    overflow: visible;
    max-width: none;
  }
  .cal-chart--month .cal-bar-col:first-child.is-selected .cal-bar-val,
  .cal-chart--month .cal-bar-col:first-child.is-month-anchor .cal-bar-val {
    align-self: flex-start;
    align-items: flex-start;
  }
  .cal-chart--month .cal-bar-col:last-child.is-selected .cal-bar-val,
  .cal-chart--month .cal-bar-col:last-child.is-month-anchor .cal-bar-val {
    align-self: flex-end;
    align-items: flex-end;
  }
  .cal-bar-col.is-selected .cal-bar-tok {
    color: var(--text);
    font-weight: 700;
  }
  .cal-bar-col.is-selected .cal-bar-usd {
    color: var(--muted);
    font-weight: 600;
  }
  .cal-bar-track {
    width: 100%;
    height: 54px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }
  .cal-bar-fill {
    width: 72%;
    max-width: 22px;
    min-width: 6px;
    border-radius: 2.5px 2.5px 1px 1px;
    background: color-mix(in srgb, var(--cyan) 26%, var(--pill-bg));
    transition: background-color 0.14s ease, opacity 0.14s ease;
  }
  .cal-chart--month .cal-bar-fill {
    width: 78%;
    min-width: 5px;
  }
  .cal-bar-col:hover .cal-bar-fill {
    background: color-mix(in srgb, var(--cyan) 46%, var(--pill-bg));
  }
  .cal-bar-col.is-selected .cal-bar-fill {
    background: color-mix(in srgb, var(--cyan) 72%, var(--card));
    box-shadow: none;
  }
  .cal-bar-col.is-zero .cal-bar-fill {
    border-radius: 1px;
    background: var(--divider);
    opacity: 0.75;
    box-shadow: none;
  }
  .cal-bar-col.is-zero:hover .cal-bar-fill {
    background: var(--dim);
    opacity: 0.65;
  }
  .cal-bar-col.is-zero.is-selected .cal-bar-fill {
    background: var(--cyan);
    opacity: 0.75;
    box-shadow: none;
  }
  .cal-bar-lbl {
    font-size: 9px;
    line-height: 1.15;
    min-height: 1.15em;
    color: var(--dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
  }
  .cal-chart--month .cal-bar-lbl { overflow: visible; max-width: none; }
  .cal-chart--month .cal-bar-col:first-child .cal-bar-lbl { align-self: flex-start; }
  .cal-chart--month .cal-bar-col:last-child .cal-bar-lbl { align-self: flex-end; }
  .cal-bar-col.is-zero .cal-bar-lbl {
    opacity: 0.65;
  }
  .cal-bar-col.is-selected .cal-bar-lbl {
    color: var(--text);
    font-weight: 700;
    opacity: 1;
  }
  .cal-sel-hdr {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 5px 2px 4px;
    font-size: 10px;
    border-bottom: 1px solid var(--border);
  }
  .cal-sel-left {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text);
    font-weight: 600;
  }
  .cal-sel-turns {
    color: var(--muted);
    font-weight: 400;
  }
  .cal-sel-right {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
    color: var(--muted);
  }
  .cal-sep {
    color: var(--dim);
  }
  .cal-models {
    display: flex;
    flex-direction: column;
  }
  .cal-m-hdr, .cal-m-row {
    display: grid;
    grid-template-columns: minmax(0, 36fr) minmax(0, 25fr) minmax(0, 19fr) minmax(0, 20fr);
    align-items: start;
    gap: 4px;
    padding: 4px 2px;
  }
  .cal-m-hdr {
    font-size: 9px;
    font-weight: 600;
    color: var(--dim);
    padding: 4px 2px 3px;
    border-bottom: 1px solid var(--divider);
  }
  .cal-m-hdr > span:not(:first-child) {
    text-align: right;
  }
  .cal-m-row {
    border-bottom: 1px solid var(--divider);
    font-size: 10px;
    line-height: 1.25;
  }
  .cal-m-row:last-child {
    border-bottom: none;
  }
  .cal-m-col {
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 1.5px;

</style>

<body>

  <!-- Layer 6: Collapsible Calendar Usage Statistics (Day | Week | Month) -->
  <details class="turns-box" id="calBox" open>

      </span>
      <span class="mono c-dim" id="calBadge" style="display:none"></span>
    </summary>
    <div class="cal-panel mono" id="calPanel"></div>
  </details>
</div>

<!-- Shared Chart Hover Popover -->

<script>
  const storageFallback = new Map();
  function safeGetStorage(area, key) {
    try { return window[area].getItem(key); }
    catch (_) { return storageFallback.get(area + ':' + key) || null; }
  }
  function safeSetStorage(area, key, value) {
    storageFallback.set(area + ':' + key, String(value));
    try { window[area].setItem(key, String(value)); } catch (_) {}
  }
  const renderedHtml = new WeakMap();
  function setHtml(element, html) {
    if (!element || renderedHtml.get(element) === html) return;
    element.innerHTML = html;
    renderedHtml.set(element, html);
  }
  function showStatusError(error) {
    const status = error && error.status;
    const text = status === 401 ? '⚠️ 网关鉴权失效 (401)' :
      (status === 502 || status === 503) ? `⏳ 服务重载中 (${status})` :
      error && error.kind === 'timeout' ? '⚠️ 请求超时，保留上次数据' :
      error && error.kind === 'stale' ? '⏳ 数据刷新繁忙，保留上次数据' :
      status ? `⚠️ 服务请求失败 (${status})` : '⚠️ 连接异常，保留上次数据';
    const label = document.getElementById('cacheTtl');
    if (label) {
      label.textContent = text;
      label.className = 'cache-ttl mono c-orange';
      label.title = error && error.message || text;
    }
  }
  async function request(url, options = {}, format = 'json', timeoutMs = 4500) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    try {
      const response = await fetch(url, { ...options, signal: controller.signal });
      const body = await response.text();
      if (!response.ok) throw Object.assign(new Error(body.slice(0, 240) || response.statusText), { status: response.status });
      return format === 'text' ? body : JSON.parse(body);
    } catch (error) {
      if (controller.signal.aborted) throw Object.assign(new Error('请求超时'), { kind: 'timeout' });
      throw error;
    } finally { clearTimeout(timer); }
  }
  const metric = (v, digits, unit = '') => Number.isFinite(v) ? v.toFixed(digits) + unit : '—';
  const hit = row => metric(row.prompt > 0 ? row.hit_pct : null, 1, '%');
  const rateKind = {decode:'解码', request:'请求', active:'活跃期', step_est:'步骤估算', turn:'整轮'};
  const costKind = {reported:'日志实报', mixed:'实报与估算', estimated:'价表估算', unmatched_estimate:'未匹配·估算'};
  function fmtK(n) {
    if (n == null) return '—';
    const v = Number(n || 0);
    if (v >= 999995) return (v / 1000000).toFixed(2) + 'M';
    if (v >= 100000 && v % 10000 === 0) return (v / 1000).toFixed(0) + 'k';
    if (v >= 100000) return (v / 1000).toFixed(1) + 'k';
    if (v >= 1000) return (v / 1000).toFixed(1) + 'k';
    return String(v);
  }
  function fmtUsd(n) {
    if (n == null) return '—';
    const v = Number(n || 0);
    if (v <= 0) return '$0.00';
    if (v < 0.01) return '<$0.01';
    if (v >= 1000) return '$' + v.toFixed(0);
    return '$' + v.toFixed(2);
  }
  function fmtFootUsd(n) {
    if (!Number.isFinite(n)) return '--';
    const v = Number(n);
    if (v <= 0) return '$0';
    if (v < 0.01) return '<$0.01';
    if (v < 10) return '$' + v.toFixed(2);
    if (v < 100) return '$' + v.toFixed(1);
    return '$' + Math.round(v);
  }
  function ctxClass(p, used, limit) {
    const lim = (typeof limit === 'number' && limit > 0) ? limit : 300000;
    const u = typeof used === 'number' ? used : (p * lim / 100);
    if (p >= 85 || u >= lim * 0.85) return 'c-red';
    if (p >= 65 || u >= lim * 0.65) return 'c-orange';
    if (p >= (125000 * 100 / 300000) || u >= lim * (125000 / 300000)) return 'c-yellow';
    return 'c-green';
  }
  function hitClass(h) {
    if (h > 95) return 'c-green';
    if (h >= 90) return 'c-yellow';
    if (h >= 80) return 'c-orange';
    return 'c-red';
  }
  function quotaClass(remPct) {
    if (remPct <= 10) return 'c-red';
    if (remPct <= 25) return 'c-orange';
    if (remPct <= 50) return 'c-yellow';
    return 'c-green';
  }
  function fmtRst(sec) {
    const s = Number(sec || 0);
    if (!Number.isFinite(s) || s <= 0) return '';
    if (s < 60) return '<1m';
    const d = Math.floor(s / 86400);
    const h = Math.floor((s % 86400) / 3600);
    const m = Math.floor((s % 3600) / 60);
    if (d > 0) return `${d}d${String(h).padStart(2, '0')}h`;
    if (h > 0) return `${h}h${String(m).padStart(2, '0')}m`;
    return `${m}m`;
  }
  const RING_C = 2 * Math.PI * 5.5;
  const FOOT_AGENTS = [
    { id: 'fbAgyG', ring: 'fbRingAgyG', name: 'Agy-G', prefix: 'gemini', brand: '--brand-gemini', optional: false },
    { id: 'fbAgyC', ring: 'fbRingAgyC', name: 'Agy-C', prefix: '3p', brand: '--brand-claude', optional: false },
    { id: 'fbCodex', ring: 'fbRingCodex', name: 'Codex', prefix: 'codex', brand: '--brand-codex', optional: true, flag: 'codex-installed' },
    { id: 'fbDroid', ring: 'fbRingDroid', name: 'Droid', prefix: 'droid', brand: '--brand-droid', optional: true, flag: 'droid-installed' },
    { id: 'fbGrok', ring: 'fbRingGrok', name: 'Grok', prefix: 'grok', brand: '--brand-grok', optional: true, flag: 'grok-installed' },
  ];
  function calcEstTotalUsd(b) {
    if (!b || b.estimate_ok !== true) return null;
    if (Number.isFinite(b.estimate_total_usd) && b.estimate_total_usd > 0) return b.estimate_total_usd;
    if (!Number.isFinite(b.estimate_usd) || b.estimate_usd <= 0) return null;
    const usedFrac = b.estimate_mode === 'delta' ? b.estimate_used_frac : (Number.isFinite(b.pct) ? (100 - b.pct) / 100 : null);
    const total = Number.isFinite(usedFrac) && usedFrac >= 0.0005 ? b.estimate_usd / usedFrac : null;
    return Number.isFinite(total) ? total : null;
  }
  function fmtEstUsd(val) {
    if (!Number.isFinite(val) || val <= 0) return '--';
    if (val < 10) return '~$' + val.toFixed(2);
    if (val < 100) return '~$' + val.toFixed(1);
    return '~$' + Math.round(val).toLocaleString('en-US');
  }
  function agentMinPct(qMap, prefix) {
    const pcts = [];
    for (const key of Object.keys(qMap).filter(key => key.startsWith(prefix + '-'))) {
      const b = qMap[key];
      if (b && Number.isFinite(b.pct)) pcts.push(b.pct);
    }
    return pcts.length ? Math.min.apply(null, pcts) : null;
  }
  function paintFootRing(id, pct) {
    const el = document.getElementById(id);
    if (!el) return;
    const has = typeof pct === 'number' && isFinite(pct);
    const dash = has ? (Math.max(0, Math.min(100, pct)) / 100) * RING_C : 0;
    el.setAttribute('stroke-dasharray', dash.toFixed(2) + ' ' + RING_C.toFixed(2));
    el.setAttribute('class', 'ring-fg ' + (has ? quotaClass(pct) : 'c-dim'));
  }
  function renderDrawerRow(label, b) {
    const pctCls = quotaClass(b.pct);
    const pctStr = b.pct.toFixed(0) + '%';
    const countdown = fmtRst(b.reset_sec);
    const rstStr = countdown ? (b.reset_is_estimate ? '~' : '') + countdown : '--';
    const rstTitle = b.window_boundary_uncertain ? '窗口边界不明' : '';
    const usdStr = typeof b.usd === 'number' ? fmtFootUsd(b.usd) : '--';
    const estimate = calcEstTotalUsd(b);
    const deltaPct = Number.isFinite(b.estimate_delta_pct) ? b.estimate_delta_pct : 0;
    const deltaTip = estimate != null ? '按基线后新增估算花费 / 新增已用占比推算' : '增量样本累积中' + (deltaPct >= 5 ? '（等待满 5 分钟且有新增花费）' : `（已观测 ${Number(deltaPct.toFixed(2))}% / 需 5%）`);
    const usdTitle = b.estimate_mode === 'delta' ? deltaTip : (b.usd_scope === 'legacy_rolling' ? '旧口径：滚动估算花费' : '本地估算花费 / 预计额度');
    const estStr = fmtEstUsd(estimate);
    const width = Math.max(0, Math.min(100, b.pct)).toFixed(1);
    return `<div class="qd-row"><span class="qd-dim" title="${escHtml(b.limit_id || '')}">${escHtml(label)}</span><span class="qd-bar"><span class="qd-fill ${pctCls}" style="width:${width}%"></span></span><span class="qd-pct ${pctCls}">${pctStr}</span><span class="qd-rst" title="${rstTitle}">${escHtml(rstStr)}</span><span class="qd-money" title="${usdTitle}"><strong>${usdStr}</strong><span class="qd-sep">/</span><span class="c-text">${estStr}</span></span></div>`;
  }
  function estWeeklyUsd(qMap, prefix) {
    const fromWeek = calcEstTotalUsd(qMap[prefix + '-weekly']);
    if (fromWeek != null) return fromWeek;
    const fromMonth = calcEstTotalUsd(qMap[prefix + '-monthly']);
    if (fromMonth != null) return fromMonth * (7 / 30);
    return null;
  }
  function estMonthlyUsd(qMap, prefix) {
    const fromMonth = calcEstTotalUsd(qMap[prefix + '-monthly']);
    if (fromMonth != null) return fromMonth;
    const fromWeek = calcEstTotalUsd(qMap[prefix + '-weekly']);
    const monthly = fromWeek == null ? null : fromWeek * (30 / 7);
    return Number.isFinite(monthly) ? monthly : null;
  }
  function renderAgentCard(name, qMap, prefix) {
    const dims = [['5h', prefix + '-5h'], ['周', prefix + '-weekly'], ['月', prefix + '-monthly'],
      ...Object.keys(qMap).filter(key => key.startsWith(prefix + '-window-')).map(key => ['未知周期', key])];
    const rows = [];
    for (const pair of dims) {
      const b = qMap[pair[1]];
      if (b && Number.isFinite(b.pct)) rows.push(renderDrawerRow(b.window_label || pair[0], b));
    }
    const body = rows.length ? rows.join('') : '<div class="qd-empty">暂无官方配额数据</div>';
    const estMo = fmtEstUsd(estMonthlyUsd(qMap, prefix));
    return `<section class="qd-card"><div class="qd-hdr"><span class="qd-name">${name}</span><span class="qd-est">预计月额度 <strong>${estMo}</strong></span></div><div class="qd-rows">${body}</div></section>`;
  }

    try {

      const params = ['mode=' + mode];
      if (tok.trim()) params.push('token=' + encodeURIComponent(tok.trim()));

          <div class="cal-m-col">

    const moreHtml = sorted.length > CAL_TIP_MODEL_LIMIT
      ? `<div class="ct-cal-more">其余 ${sorted.length - CAL_TIP_MODEL_LIMIT} 个模型（共 ${sorted.length} 个）</div>`
      : '';
    return `${hdr}<div class="cal-models" style="margin-top:0">${mHdr}${rowsHtml}${moreHtml}</div>`;
  }

  function renderCalendar(cal) {
    syncCalTabs();
    const sumTitleEl = document.getElementById('calSummary');
    const badgeEl = document.getElementById('calBadge');
    const panelEl = document.getElementById('calPanel');
    if (!panelEl) return;

    const bucketData = (cal && typeof cal === 'object') ? cal[calMode] : null;
    if (!bucketData || typeof bucketData !== 'object') {
      latestCalItems = [];
      if (sumTitleEl) sumTitleEl.textContent = '日历';
      if (badgeEl) badgeEl.textContent = '--';
      setHtml(panelEl, '');
      if (activeTipSource && activeTipSource.kind === 'cal') hideChartTip();
      return;
    }

    const periodLabel = bucketData.period_label || CAL_PERIOD_FALLBACK[calMode] || '近15天';
    const sum = bucketData.summary || {};
    if (sumTitleEl) {
      sumTitleEl.textContent = `日历 (${periodLabel})`;

    if (badgeEl) {
      setHtml(badgeEl, `${escHtml(periodLabel)} ${Number(sum.turns || 0)}轮`);

    const items = Array.isArray(bucketData.items) ? bucketData.items : [];
    latestCalItems = items;
    if (!items.length) {
      setHtml(panelEl, `<div class="cal-empty">${calMode === 'day' ? '当日暂无用量' : '该周期暂无用量'}</div>`);
      if (activeTipSource && activeTipSource.kind === 'cal') hideChartTip();
      return;
    }

    const currentKey = calItemKey(items[0]);
    const isDense = calMode === 'month' || items.length > 7;
    const monthAnchorKey = isDense ? currentKey : '';
    const ordered = items.slice().reverse();
    const maxTotal = ordered.reduce((mx, b) => Math.max(mx, calItemTotal(b)), 0);
    const BAR_MAX_PX = 54;

    const barsHtml = ordered.map((b, idx) => {
      const key = calItemKey(b);
      const turns = Number(b.turns || 0);
      const prompt = Number(b.prompt || 0);
      const total = calItemTotal(b);
      const cost = Number(b.cost || 0);
      const hitVal = (b.hit_pct != null && Number.isFinite(Number(b.hit_pct))) ? Number(b.hit_pct) : null;
      const isCurrent = Boolean(currentKey) && key === currentKey;
      const isMonthAnchor = Boolean(monthAnchorKey) && key === monthAnchorKey;
      const isZero = total <= 0;
      const barHeight = isZero || maxTotal <= 0
        ? 2
        : Math.max(4, Math.round((total / maxTotal) * BAR_MAX_PX));
      const showVal = isDense
        ? (isMonthAnchor && (total > 0 || cost > 0))
        : (total > 0 || cost > 0);
      const valHtml = showVal
        ? `<span class="cal-bar-tok">${escHtml(fmtCalTok(total))}</span><span class="cal-bar-usd">${escHtml(fmtCalUsd(cost))}</span>`
        : '';
      const axisLbl = formatCalAxisLabel(calMode, b, idx, ordered.length);
      const fullPeriod = b.sub_label ? `${b.label || key} ${b.sub_label}` : `${b.label || key}`;
      const hitStr = (prompt > 0 && hitVal != null) ? `${hitVal.toFixed(1)}%` : '—';
      const aria = `${fullPeriod} · ${turns}轮 · 总量 ${fmtCalTok(total)} · 命中 ${hitStr} · ${fmtCalUsd(cost)}`;
      const cls = ['cal-bar-col', isCurrent ? 'is-current' : '', isMonthAnchor ? 'is-month-anchor' : '', isZero ? 'is-zero' : ''].filter(Boolean).join(' ');
      return `
        <button type="button" class="${cls}" data-cal-key="${escHtml(key)}" aria-label="${escHtml(aria)}">
          <span class="cal-bar-val">${valHtml}</span>
          <span class="cal-bar-track" aria-hidden="true"><span class="cal-bar-fill" style="height:${barHeight}px"></span></span>
          <span class="cal-bar-lbl">${escHtml(axisLbl)}</span>
        </button>

    }).join('');

    const chartCls = isDense
      ? 'cal-chart cal-chart--month cal-chart--collapsed'
      : 'cal-chart cal-chart--collapsed';
    const panelHtml = `<div class="${chartCls}" role="group" aria-label="${escHtml(periodLabel)}用量柱状图">${barsHtml}</div>`;

    const activeBar = document.activeElement && document.activeElement.closest
      ? document.activeElement.closest('button.cal-bar-col') : null;
    const focusedKey = (activeBar && panelEl.contains(activeBar))
      ? activeBar.getAttribute('data-cal-key') : null;

    setHtml(panelEl, panelHtml);

    if (focusedKey && !panelEl.contains(document.activeElement)) {
      focusCalBar(panelEl, focusedKey);

    if (activeTipSource && activeTipSource.kind === 'cal') {
      const match = items.find(b => calItemKey(b) === activeTipSource.key);
      const barEl = match ? Array.from(panelEl.querySelectorAll('button.cal-bar-col')).find(el => el.getAttribute('data-cal-key') === activeTipSource.key) : null;
      if (match && barEl) {
        showChartTip(barEl, buildCalTipHtml(match, calMode), { kind: 'cal', key: activeTipSource.key, wide: true });
      } else {
        hideChartTip();
      }

  function switchCalMode(mode) {

  CAL_MODES.forEach(mode => {

      if (e.key === ' ' || e.key === 'Enter') {

        switchCalMode(mode);
      } else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
        e.preventDefault();
        e.stopPropagation();
        const idx = CAL_MODES.indexOf(calMode);
        const nextMode = CAL_MODES[(idx + (e.key === 'ArrowRight' ? 1 : CAL_MODES.length - 1)) % CAL_MODES.length];
        const nextBtn = document.getElementById(CAL_TAB_IDS[nextMode]);
        if (nextBtn) nextBtn.focus();
        switchCalMode(nextMode);

  });
  const calPanelEl = document.getElementById('calPanel');
  if (calPanelEl) {

      if (!btn || !calPanelEl.contains(btn)) return;
      const key = btn.getAttribute('data-cal-key') || '';
      const item = latestCalItems.find(b => calItemKey(b) === key);

    calPanelEl.addEventListener('mouseover', e => {
      const btn = e.target && e.target.closest ? e.target.closest('button.cal-bar-col') : null;
      if (btn) openCalBarTip(btn);
    });
    calPanelEl.addEventListener('focusin', e => {

      if (btn) openCalBarTip(btn);
    });
    calPanelEl.addEventListener('mouseleave', () => {

    calPanelEl.addEventListener('focusout', e => {
      if (!calPanelEl.contains(e.relatedTarget) && activeTipSource && activeTipSource.kind === 'cal') {
        hideChartTip();
      }
    });
    calPanelEl.addEventListener('keydown', e => {
      const btn = e.target && e.target.closest ? e.target.closest('button.cal-bar-col') : null;
      if (!btn || !calPanelEl.contains(btn)) return;
      if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        e.preventDefault();
        const cols = Array.from(calPanelEl.querySelectorAll('button.cal-bar-col'));
        const idx = cols.indexOf(btn);
        if (idx < 0 || !cols.length) return;
        const delta = e.key === 'ArrowRight' ? 1 : -1;

  syncCalTabs();
  let lastSubConvId = '';

  function fmtSubModel(model) {

      .replace(/\s+(low|med|medium|high|xhigh|max)\s*$/i, (_, e) => ':' + e.toLowerCase());
  }
  function buildSubTipHtml(item) {
    if (!item || typeof item !== 'object') return '';
    const nameTxt = String(item.label || '子代理');
    const agentTxt = String(item.agent || '').trim();

    const metaParts = [agentTxt, modelShort].filter(Boolean).join(' · ');

    const hitCls = item.metrics_unavailable ? 'c-dim' : hitClass(item.hit_pct);

    const stLbl = ({running: '运行中', error: '失败', killed: '已停止', waiting: '等待中'})[item.status] || '已完成';
    return `

        </div>
        <div class="ct-cell">

  }

  const subListDelegEl = document.getElementById('subList');
  if (subListDelegEl) {

    subListDelegEl.addEventListener('focusout', e => {

        hideChartTip();
      }
    });
  }

  // ---- Shared Floating Chart Hover Tooltip ----
  const chartTipEl = document.getElementById('chartTip');
  let activeTipSource = null; // { kind: 'model'|'turn', key: string, anchor: Element }

  function showChartTip(anchorEl, html, sourceInfo) {
    if (!chartTipEl || !anchorEl || !html) return;
    chartTipEl.classList.toggle('is-wide', Boolean(sourceInfo && sourceInfo.wide));
    chartTipEl.innerHTML = html;
    chartTipEl.setAttribute('aria-hidden', 'false');
    chartTipEl.classList.add('open');
    activeTipSource = sourceInfo ? { ...sourceInfo, anchor: anchorEl } : null;
    const rect = anchorEl.getBoundingClientRect();
    const tipW = chartTipEl.offsetWidth || (sourceInfo && sourceInfo.wide ? 292 : 228);
    const tipH = chartTipEl.offsetHeight || 96;
    const vw = window.innerWidth || 360;
    const vh = window.innerHeight || 800;
    const left = Math.max(8, Math.min(vw - tipW - 8, rect.left + rect.width / 2 - tipW / 2));
    let top = rect.top - tipH - 8;
    if (top < 8) {
      top = Math.min(vh - tipH - 8, rect.bottom + 8);
    }
    chartTipEl.style.left = `${Math.round(left)}px`;
    chartTipEl.style.top = `${Math.round(Math.max(8, top))}px`;
  }
  function hideChartTip() {
    if (chartTipEl) {
      chartTipEl.classList.remove('open');
      chartTipEl.setAttribute('aria-hidden', 'true');
    }
    activeTipSource = null;
  }
  window.addEventListener('scroll', hideChartTip, true);

  let latestTokenTipData = null;
  function buildTokenCardTipHtml(kind) {
    if (!latestTokenTipData) return '';
    const { lt, cum, inCachePct, outThinkPct } = latestTokenTipData;
    if (kind === 'in') {
      const newPct = Number(cum.prompt || 0) > 0 ? Math.max(0, 100 - inCachePct) : 0;
      return `
        <div class="ct-hdr">
          <div class="ct-left">
            <span class="ct-title">输入明细</span>
            <span class="ct-meta">本轮 #${escHtml(lt.turn)}</span>
          </div>
          <div class="ct-right"><strong>${escHtml(fmtUsd(cum.cost_prompt))}</strong></div>
        </div>
        <div class="ct-grid">
          <div class="ct-cell">
            <span class="ct-lbl">缓存命中 (${inCachePct.toFixed(1)}%)</span>
            <span class="ct-val c-green">${escHtml(fmtK(cum.cache))}</span>
            <span class="ct-sub">本轮 ${escHtml(fmtK(lt.cache))} · ${escHtml(fmtUsd(cum.cost_cache))}</span>
          </div>
          <div class="ct-cell">
            <span class="ct-lbl">新增输入 (${newPct.toFixed(1)}%)</span>
            <span class="ct-val c-blue">${escHtml(fmtK(cum.in))}</span>
            <span class="ct-sub">本轮 ${escHtml(fmtK(lt.in))} · ${escHtml(fmtUsd(cum.cost_in))}</span>
          </div>

    return `
      <div class="ct-hdr">
        <div class="ct-left">
          <span class="ct-title">输出明细</span>
          <span class="ct-meta">本轮 #${escHtml(lt.turn)}</span>
        </div>
        <div class="ct-right"><strong>${escHtml(fmtUsd(cum.cost_out))}</strong></div>

      <div class="ct-grid">
        <div class="ct-cell">

  [['tkInCard', 'in', 'tk_in'], ['tkOutCard', 'out', 'tk_out']].forEach(([elId, kind, tipKind]) => {
    const cardEl = document.getElementById(elId);

      if (html) showChartTip(cardEl, html, { kind: tipKind, key: kind });

      if (activeTipSource && activeTipSource.kind === tipKind) hideChartTip();

    cardEl.addEventListener('focusin', openTip);
    cardEl.addEventListener('mouseleave', closeTip);

  // ---- Model Board (Bar Chart: All Highlighted + Hover Popover) ----
  let latestModelItems = [];

  function modelItemTotal(item) {
    if (!item || typeof item !== 'object') return 0;
    return Number(item.prompt || 0) + Number(item.out || 0);
  }
  function shortModelAxisLabel(name) {
    return String(name || '未知模型').trim().replace(/^models\//i, '') || '未知模型';
  }
  function modelBrandVar(name) {
    const s = String(name || '').toLowerCase();
    if (/claude|opus|sonnet|haiku/.test(s)) return 'var(--brand-claude)';
    if (/gpt|codex|astra|\bsol\b|\bo[134]\b/.test(s)) return 'var(--brand-codex)';
    if (/grok/.test(s)) return 'var(--brand-grok)';
    if (/gemini|neon|argon|carbon|hydrogen|flash/.test(s)) return 'var(--brand-gemini)';
    if (/droid/.test(s)) return 'var(--brand-droid)';
    return 'var(--cyan)';
  }
  function sortModelItems(items) {
    return (Array.isArray(items) ? items : []).slice().sort((a, b) => {
      const ta = modelItemTotal(a);
      const tb = modelItemTotal(b);
      if (tb !== ta) return tb - ta;
      const ca = Number(a && a.cost || 0);
      const cb = Number(b && b.cost || 0);
      if (cb !== ca) return cb - ca;
      const ra = Number(a && a.calls || 0);
      const rb = Number(b && b.calls || 0);
      if (rb !== ra) return rb - ra;
      return String(a && a.model || '').localeCompare(String(b && b.model || ''));
    });
  }
  function buildModelTipHtml(item) {
    if (!item || typeof item !== 'object') return '';
    const name = String(item.model || '未知模型');
    const sourceTag = String(item.source_tag || '').trim();
    const calls = Number(item.calls || 0);
    const meta = sourceTag ? `${sourceTag} · ${calls}次` : `${calls}次`;
    const cost = Number(item.cost || 0);
    const costPct = (item.cost_pct != null && item.cost_pct !== '' && Number.isFinite(Number(item.cost_pct)))
      ? Number(item.cost_pct) : null;
    const hitValid = Number(item.prompt || 0) > 0 && item.hit_pct != null && Number.isFinite(Number(item.hit_pct));
    const hitCls = hitValid ? hitClass(Number(item.hit_pct)) : 'c-dim';
    return `
      <div class="ct-hdr">
        <div class="ct-left">
          <span class="ct-title">${escHtml(name)}</span>
          <span class="ct-meta">${escHtml(meta)}</span>
        </div>
        <div class="ct-right">
          <strong>${escHtml(fmtUsd(cost))}</strong>
          ${costPct != null ? `<span class="ct-pct">${costPct.toFixed(1)}%</span>` : ''}
        </div>
      </div>
      <div class="ct-grid">
        <div class="ct-cell">
          <span class="ct-lbl">In</span>
          <span class="ct-val">${escHtml(fmtK(item.prompt))}</span>

        <div class="ct-cell">
          <span class="ct-lbl">Out</span>

        </div>

          <span class="ct-lbl">新增输入</span>
          <span class="ct-val c-blue">${escHtml(fmtK(item.in))}</span>
        </div>
      </div>
    `;
  }
  function renderModelPanel(items) {
    const panelEl = document.getElementById('modelPanel');
    if (!panelEl) return;
    const sorted = sortModelItems(items);
    latestModelItems = sorted;
    if (!sorted.length) {
      setHtml(panelEl, '');
      if (activeTipSource && activeTipSource.kind === 'model') hideChartTip();
      return;
    }
    const maxTotal = sorted.reduce((mx, it) => Math.max(mx, modelItemTotal(it)), 0);
    const BAR_MAX_PX = 54;

    const barsHtml = sorted.map(it => {
      const rec = (it && typeof it === 'object') ? it : {};
      const key = String(rec.model || '未知模型');
      const total = modelItemTotal(rec);
      const cost = Number(rec.cost || 0);
      const calls = Number(rec.calls || 0);
      const sourceTag = String(rec.source_tag || '').trim();
      const isZero = total <= 0;
      const barHeight = isZero || maxTotal <= 0
        ? 2
        : Math.max(4, Math.round((total / maxTotal) * BAR_MAX_PX));
      const valHtml = (total > 0 || cost > 0)
        ? `<span class="cal-bar-tok">${escHtml(fmtCalTok(total))}</span><span class="cal-bar-usd">${escHtml(fmtUsd(cost))}</span>`
        : '';
      const axisLbl = shortModelAxisLabel(key);
      const aria = `${key}${sourceTag ? ' · ' + sourceTag : ''} · ${calls}次 · 总量 ${fmtCalTok(total)} · 命中 ${hit(rec)} · API ${fmtUsd(cost)}`;
      const cls = ['cal-bar-col', 'mb-bar-col', isZero ? 'is-zero' : ''].filter(Boolean).join(' ');
      const barColor = modelBrandVar(key);
      return `
        <button type="button" class="${cls}" style="--mb-color:${barColor}" data-model-key="${escHtml(key)}" aria-label="${escHtml(aria)}">
          <span class="cal-bar-val">${valHtml}</span>
          <span class="cal-bar-track" aria-hidden="true"><span class="cal-bar-fill" style="height:${barHeight}px"></span></span>
          <span class="cal-bar-lbl">${escHtml(axisLbl)}</span>
        </button>

  // ---- Per-Turn History (Header Tabs + Interactive SVG Line/Combo Chart + Hover Popover) ----
  const TURN_METRICS = [
    { key: 'ctx', label: '上下文', tabId: 'turnTabCtx' },
    { key: 'prompt', label: 'Prompt', tabId: 'turnTabPrompt' },
    { key: 'tps', label: 'TPS', tabId: 'turnTabTps' },
    { key: 'ttft', label: 'TTFT', tabId: 'turnTabTtft' },
    { key: 'dur', label: '耗时', tabId: 'turnTabDur' },
  ];
  const TURN_METRIC_KEYS = TURN_METRICS.map(m => m.key);
  let turnMetric = safeGetStorage('sessionStorage', 'agy_turn_metric') || 'ctx';
  if (turnMetric === 'out' || turnMetric === 'hit_pct') turnMetric = 'prompt';
  if (!TURN_METRIC_KEYS.includes(turnMetric)) turnMetric = 'ctx';
  let latestTurnsDesc = [];
  let latestTurnPts = [];
  let turnBaseY = 84;
  let turnPadT = 10;

  function parseFiniteNum(v) {
    if (v === null || v === undefined || v === '' || typeof v === 'boolean') return null;
    const n = Number(v);
    return Number.isFinite(n) ? n : null;
  }
  function getTurnMetricVal(t, metricKey) {
    if (!t || typeof t !== 'object') return null;
    if (metricKey === 'ctx') return parseFiniteNum(t.ctx);
    if (metricKey === 'prompt') return parseFiniteNum(t.prompt);
    if (metricKey === 'out') return parseFiniteNum(t.out);
    if (metricKey === 'hit_pct') {
      const prompt = parseFiniteNum(t.prompt);
      if (prompt == null || prompt <= 0) return null;
      return parseFiniteNum(t.hit_pct);
    }
    if (metricKey === 'tps') return parseFiniteNum(t.tps);
    if (metricKey === 'ttft') return parseFiniteNum(t.ttft);
    if (metricKey === 'dur') return parseFiniteNum(t.dur);
    return null;
  }
  function niceChartMax(maxVal, minCeil) {
    if (!Number.isFinite(maxVal) || maxVal <= 0) return minCeil;
    const raw = maxVal * 1.1;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const norm = raw / mag;
    const step = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 2.5 ? 2.5 : norm <= 5 ? 5 : 10;
    return Math.max(minCeil, step * mag);
  }
  function fmtTurnYTick(metricKey, v) {
    if (!Number.isFinite(v)) return '0';
    if (metricKey === 'ctx' || metricKey === 'prompt' || metricKey === 'out') return v <= 0 ? '0' : fmtCalTok(Math.round(v));
    if (metricKey === 'hit_pct') return Math.round(v) + '%';
    if (metricKey === 'tps') return v <= 0 ? '0' : (v >= 10 ? String(Math.round(v)) : v.toFixed(1));
    if (metricKey === 'ttft') return v <= 0 ? '0' : (v >= 10 ? Math.round(v) + 's' : v.toFixed(1) + 's');
    if (metricKey === 'dur') return v <= 0 ? '0' : fmtDur(v);
    return String(v);
  }
  function fmtTurnMetricVal(metricKey, v) {
    if (v == null || !Number.isFinite(v)) return '—';
    if (metricKey === 'ctx' || metricKey === 'prompt' || metricKey === 'out') return fmtK(v);
    if (metricKey === 'hit_pct') return v.toFixed(1) + '%';
    if (metricKey === 'tps') return v.toFixed(1) + ' t/s';
    if (metricKey === 'ttft') return v.toFixed(1) + 's';
    if (metricKey === 'dur') return fmtDur(v);
    return String(v);
  }
  function syncTurnTabs() {

  function switchTurnMetric(metricKey) {

  }
  function buildTurnTipHtml(t) {
    if (!t || typeof t !== 'object') return '';
    const calls = Number(t.calls_count || 0);

    return `
      <div class="ct-hdr">

        </div>

        <div class="ct-cell${act('prompt')}">
          <span class="ct-lbl">输入 In</span>

          <span class="ct-sub">缓${escHtml(fmtK(t.cache))} / 新${escHtml(fmtK(t.in))}</span>
        </div>
        <div class="ct-cell${act('out')}">

  function setTurnHoverVisual(panelEl, pt) {
    if (!panelEl) return;
    const layer = panelEl.querySelector('.turn-hover-layer');
    if (!layer) return;
    if (!pt) {
      layer.style.display = 'none';

    const line = layer.querySelector('.turn-guide');
    const halo = layer.querySelector('.turn-sel-halo');
    const dot = layer.querySelector('.turn-sel-dot');

          dot.setAttribute('cy', turnBaseY.toFixed(1));
          dot.setAttribute('r', '3.2');

    layer.style.display = '';
  }
  function buildLineSegs(ptsList, yKey) {
    const segs = [];
    let cur = [];
    for (let i = 0; i < ptsList.length; i++) {
      if (ptsList[i][yKey] !== null) {
        cur.push({ x: ptsList[i].x, y: ptsList[i][yKey] });
      } else if (cur.length) {
        segs.push(cur);
        cur = [];
      }
    }
    if (cur.length) segs.push(cur);
    return segs;
  }
  function renderTurnsPanel(turnsDesc) {
    syncTurnTabs();
    const panelEl = document.getElementById('turnPanel');
    if (!panelEl) return;
    latestTurnsDesc = Array.isArray(turnsDesc) ? turnsDesc : [];
    const asc = latestTurnsDesc.slice().reverse();

    if (!asc.length) {
      latestTurnPts = [];
      setHtml(panelEl, '<div class="cal-empty">暂无对话轮次</div>');
      if (activeTipSource && activeTipSource.kind === 'turn') hideChartTip();
      return;
    }

    const isCombo = turnMetric === 'prompt';
    const SVG_W = 320;
    const SVG_H = 104;
    const PAD_L = 34;
    const PAD_R = isCombo ? 26 : 12;
    const PAD_T = 10;
    const PAD_B = 20;
    const PLOT_W = SVG_W - PAD_L - PAD_R;
    const PLOT_H = SVG_H - PAD_T - PAD_B;
    const BASE_Y = PAD_T + PLOT_H;
    turnPadT = PAD_T;
    turnBaseY = BASE_Y;
    const n = asc.length;
    const dotR = n > 24 ? 1.8 : (n > 14 ? 2.2 : 2.8);

    const getX = i => (n <= 1 ? PAD_L + PLOT_W / 2 : PAD_L + (i / (n - 1)) * PLOT_W);
    const scaleY = (v, maxV) => {
      const ratio = maxV > 0 ? Math.max(0, Math.min(1, v / maxV)) : 0;
      return BASE_Y - ratio * PLOT_H;
    };

    let pts = [];
    let gridHtml = '';
    let barsHtml = '';
    let areaPaths = [];
    let linePaths = [];
    let dotsHtml = '';
    let legendHtml = '';

    if (isCombo) {
      const inVals = asc.map(t => getTurnMetricVal(t, 'prompt'));
      const outVals = asc.map(t => getTurnMetricVal(t, 'out'));
      const hitVals = asc.map(t => getTurnMetricVal(t, 'hit_pct'));
      const totVals = asc.map((_, i) => {
        const vi = inVals[i] || 0;
        const vo = outVals[i] || 0;
        return (inVals[i] === null && outVals[i] === null) ? null : (vi + vo);
      });
      const posTot = totVals.filter(v => v !== null && v > 0);
      const maxPos = posTot.length ? Math.max.apply(null, posTot) : 10000;
      const minPos = posTot.length ? Math.min.apply(null, posTot) : 1000;
      const maxExp = Math.max(4, Math.ceil(Math.log10(Math.max(maxPos, 10))));
      let minExp = Math.min(maxExp - 2, Math.max(2, Math.floor(Math.log10(Math.max(minPos, 10)))));
      if ((maxExp - minExp) % 2 !== 0) minExp = Math.max(1, minExp - 1);
      const spanExp = Math.max(2, maxExp - minExp);
      const scaleLogY = v => {
        if (v === null || v <= 0) return BASE_Y;
        const ratio = Math.max(0.03, Math.min(1, (Math.log10(Math.max(v, 1)) - minExp) / spanExp));
        return BASE_Y - ratio * PLOT_H;
      };

      pts = asc.map((t, i) => {
        const x = getX(i);
        const vIn = inVals[i] || 0;
        const vOut = outVals[i] || 0;
        const vTot = totVals[i];
        const vHit = hitVals[i];
        return {
          i, turn: t.turn, compacted: Boolean(t.compacted), combo: true,
          x, v: vTot, vIn, vOut, vHit,
          y: vTot !== null ? scaleLogY(vTot) : null,
          yHit: vHit !== null ? scaleY(vHit, 100) : null,
          raw: t,
        };
      });

      const expTicks = [maxExp, (maxExp + minExp) / 2, minExp];
      const hitTicks = [100, 50, 0];
      gridHtml = expTicks.map((exp, idx) => {
        const ratio = (exp - minExp) / spanExp;
        const gy = (BASE_Y - ratio * PLOT_H).toFixed(1);
        const tickVal = Math.round(Math.pow(10, exp));
        return `<line class="turn-grid" x1="${PAD_L}" y1="${gy}" x2="${SVG_W - PAD_R}" y2="${gy}" />` +
          `<text class="turn-axis-lbl" x="${PAD_L - 4}" y="${(Number(gy) + 3).toFixed(1)}" text-anchor="end">${escHtml(fmtTurnYTick('prompt', tickVal))}</text>` +
          `<text class="turn-axis-lbl" x="${SVG_W - PAD_R + 4}" y="${(Number(gy) + 3).toFixed(1)}" text-anchor="start">${hitTicks[idx]}%</text>`;
      }).join('');

      const barW = Math.max(2.5, Math.min(14, (PLOT_W / Math.max(n, 1)) * 0.56));
      barsHtml = pts.map(p => {
        if (p.v === null || p.v <= 0) return '';
        const totH = Math.max(2, BASE_Y - scaleLogY(p.v));
        const rawOutH = p.vOut > 0 ? Math.max(1.5, (p.vOut / p.v) * totH) : 0;
        const outH = Math.min(totH, rawOutH);
        const inH = Math.max(0, totH - outH);
        const bx = (p.x - barW / 2).toFixed(1);
        let rects = '';
        if (inH > 0) {
          rects += `<rect class="turn-bar" x="${bx}" y="${(BASE_Y - inH).toFixed(1)}" width="${barW.toFixed(1)}" height="${inH.toFixed(1)}" rx="1" />`;
        }
        if (outH > 0) {
          rects += `<rect class="turn-bar--out" x="${bx}" y="${(BASE_Y - inH - outH).toFixed(1)}" width="${barW.toFixed(1)}" height="${outH.toFixed(1)}" rx="1" />`;
        }
        return rects;
      }).join('');

      buildLineSegs(pts, 'yHit').forEach(seg => {
        if (seg.length < 2) return;
        const d = seg.map((p, idx) => `${idx === 0 ? 'M' : 'L'}${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
        linePaths.push(`<path class="turn-line turn-line--hit" d="${d}" />`);
      });

      const comboDotR = Math.max(1.6, dotR - 0.3);
      dotsHtml = pts.map(p => {
        let out = '';
        if (p.yHit !== null) out += `<circle class="turn-dot turn-dot--hit" cx="${p.x.toFixed(1)}" cy="${p.yHit.toFixed(1)}" r="${comboDotR}" />`;
        if (p.compacted) {

        return out;
      }).join('');

      legendHtml = `
        <div class="turn-legend">
          <span class="turn-legend-item"><span class="turn-legend-bar"></span>In</span>
          <span class="turn-legend-item"><span class="turn-legend-bar" style="background:color-mix(in srgb, var(--yellow) 72%, var(--card))"></span>Out</span>
          <span class="turn-legend-item" style="color:var(--dim)">log</span>

    } else {
      const vals = asc.map(t => getTurnMetricVal(t, turnMetric));

      const maxRaw = validVals.length ? Math.max.apply(null, validVals) : 0;

      let yMax = 100;
      if (turnMetric === 'ctx') yMax = niceChartMax(maxRaw, 1000);
      else if (turnMetric === 'tps') yMax = niceChartMax(maxRaw, 10);
      else if (turnMetric === 'ttft') yMax = niceChartMax(maxRaw, 1);
      else if (turnMetric === 'dur') yMax = niceChartMax(maxRaw, 5);

      });

      buildLineSegs(pts, 'y').forEach(seg => {
        if (seg.length < 2) return;

      }).join('');

      dotsHtml = pts.map(p => {
        let out = '';
        if (p.y !== null) {

    latestTurnPts = pts;

    const tickIndices = new Set();
    if (n <= 7) {
      for (let i = 0; i < n; i++) tickIndices.add(i);
    } else {
      tickIndices.add(0);
      tickIndices.add(n - 1);
      const innerCount = 3;
      for (let k = 1; k <= innerCount; k++) {
        tickIndices.add(Math.round((k * (n - 1)) / (innerCount + 1)));
      }
    }
    const sortedTicks = Array.from(tickIndices).sort((a, b) => a - b);
    let lastDrawnX = -999;
    const xLabelItems = [];
    for (let k = 0; k < sortedTicks.length; k++) {
      const idx = sortedTicks[k];
      const px = pts[idx].x;
      if (px - lastDrawnX < 26 && idx !== n - 1) continue;
      lastDrawnX = px;

    }
    const xLabelsHtml = xLabelItems.map(item => {
      const anchor = item.x <= PAD_L + 10 ? 'start' : (item.x >= SVG_W - PAD_R - 10 ? 'end' : 'middle');
      return `<text class="turn-axis-lbl" x="${item.x.toFixed(1)}" y="${SVG_H - 4}" text-anchor="${anchor}">#${escHtml(asc[item.idx].turn)}</text>`;
    }).join('');

    const metricMeta = TURN_METRICS.find(m => m.key === turnMetric) || TURN_METRICS[0];
    const hitRectsHtml = pts.map((p, i) => {
      const leftBound = i === 0 ? Math.max(0, PAD_L - 8) : (pts[i - 1].x + p.x) / 2;
      const rightBound = i === n - 1 ? Math.min(SVG_W, SVG_W - PAD_R + 8) : (p.x + pts[i + 1].x) / 2;
      const rw = Math.max(4, rightBound - leftBound);
      const t = asc[i];
      const lbl = isCombo
        ? `第 #${t.turn} 轮 · In ${fmtK(t.prompt)} · Out ${fmtK(t.out)} · 命中 ${hit(t)}`

      tps: 'var(--green)',

  TURN_METRICS.forEach(m => {

    btn.addEventListener('keydown', e => {

        e.preventDefault();
        e.stopPropagation();

      } else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
        e.preventDefault();
        e.stopPropagation();
        const idx = TURN_METRIC_KEYS.indexOf(turnMetric);
        const nextKey = TURN_METRIC_KEYS[(idx + (e.key === 'ArrowRight' ? 1 : TURN_METRIC_KEYS.length - 1)) % TURN_METRIC_KEYS.length];
        const nextMeta = TURN_METRICS.find(x => x.key === nextKey);

  syncTurnTabs();

  const turnPanelEl = document.getElementById('turnPanel');
  if (turnPanelEl) {
    function openTurnHitTip(hitEl) {
      if (!hitEl || !turnPanelEl.contains(hitEl)) return;

      const pt = latestTurnPts.find(p => String(p.turn) === key);

    turnPanelEl.addEventListener('focusout', e => {

  }
  let reqSeq = 0;
  const urlParams = new URLSearchParams(window.location.search);
  const pinnedConvId = (urlParams.get('conversationId') || urlParams.get('id') || '').trim();
  const sidecarToken = (urlParams.get('token') || '').trim();
  const tokenParam = sidecarToken ? '&token=' + encodeURIComponent(sidecarToken) : '';
  let inFlight = 0;
  let refreshPending = false;

  function renderSparkBars(svgId, turnsDesc, field, minRefMax, clsFn) {
    const svg = document.getElementById(svgId);
    if (!svg) return;
    const N = 6;
    const recent = (turnsDesc || []).slice(0, N).reverse();
    const padCount = Math.max(0, N - recent.length);
    const vals = recent.map(t => Math.max(0, Number((t && t[field]) || 0)));
    const maxVal = Math.max(minRefMax, ...vals, 0.001);
    let rects = '';
    for (let i = 0; i < N; i++) {
      const x = (0.7 + i * 4.0).toFixed(2);
      if (i < padCount || recent[i-padCount]?.[field] == null) {
        rects += `<rect class="spark-empty" x="${x}" y="22" width="2.6" height="2" rx="1" />`;
      } else {
        const idx = i - padCount;
        const v = vals[idx];
        const isLatest = idx === recent.length - 1;
        const h = v > 0 ? Math.max(4, Math.min(22, (v / maxVal) * 22)) : 2;
        const y = (24 - h).toFixed(2);
        const cls = isLatest ? ('spark-curr ' + clsFn(v)) : 'spark-hist';
        rects += `<rect class="${cls}" x="${x}" y="${y}" width="2.6" height="${h.toFixed(2)}" rx="1.1" />`;
      }
    }
    svg.innerHTML = rects;
  }

  function fmtSec(sec) {
    const s = Math.max(0, Math.floor(sec));
    const m = Math.floor(s / 60);
    const r = s % 60;
    return String(m).padStart(2, '0') + ':' + String(r).padStart(2, '0');
  }

  function fmtDur(sec) {
    const v = Number(sec || 0);
    if (v <= 0) return '0s';
    if (v < 10) return v.toFixed(1) + 's';
    const s = Math.round(v);
    if (s < 60) return s + 's';
    if (s < 3600) {
      const m = Math.floor(s / 60);
      const r = s % 60;
      return `${m}m${String(r).padStart(2, '0')}s`;
    }
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    return `${h}h${String(m).padStart(2, '0')}m`;
  }

  function iframeVisible() {
    if (document.hidden || window.innerWidth <= 0 || document.documentElement.clientWidth <= 0) return false;
    try {
      const frame = window.frameElement;
      if (frame && (frame.offsetWidth <= 0 || getComputedStyle(frame).display === 'none')) return false;
    } catch (_) {}
    return true;
  }

  async function refresh(force) {
    if (!iframeVisible()) return;
    if (inFlight) { if (force) refreshPending = true; return; }
    inFlight++;
    const mySeq = ++reqSeq;
    try {
      const data = await request('/api/status?v=' + UI_VERSION + (pinnedConvId ? '&id=' + encodeURIComponent(pinnedConvId) : '') + tokenParam);
      if (mySeq !== reqSeq) return;
      if (data.ui_version && data.ui_version !== UI_VERSION) {
        const key = 'uiReload:' + data.ui_version + ':' + pinnedConvId;
        let state;
        try { state = JSON.parse(safeGetStorage('sessionStorage', key) || '{}'); } catch (_) { state = {}; }
        const now = Date.now();
        if ((state.attempts || 0) < 3 && now - (state.last || 0) >= 5000) {
          state = { attempts: (state.attempts || 0) + 1, last: now };
          safeSetStorage('sessionStorage', key, JSON.stringify(state));
          const target = new URL(window.location.href);
          if (!target.searchParams.get('token') && sidecarToken) target.searchParams.set('token', sidecarToken);
          const html = await request(target.toString(), { cache: 'no-store' }, 'text');
          const version = html.match(/const UI_VERSION = (\d+)\s*;/);
          if (html.includes('AGY Cockpit') && version && Number(version[1]) === data.ui_version) {
            window.location.replace(target.toString());
          } else { showStatusError(new Error('新界面版本尚未就绪')); }
        }
        return;
      }

      if (data.theme) {
        applyTheme(data.theme, false);
      }

      const st = data.active;
      const cal = data.calendar || (st && st.calendar) || null;
      latestCalendar = cal;
      if (typeof data.quota_fetched_at === 'number') {
        latestQuotaFetchedAt = data.quota_fetched_at;
      }
      renderQuotaFootBar(data.quota, st && st.model);
      if (st && st.error && st.empty) {
        if (cal) renderCalendar(latestCalendar);
        showStatusError(new Error(st.error));
        return;
      }
      if (!st || st.empty) {
        resetEmptyState(st);
        renderCalendar(latestCalendar);
        return;
      }

      const m = st.model;
      const ctx = st.context;
      const cum = st.cumulative;
      const lt = st.latest_turn;
      const lc = st.latest_call;
      const ls = st.live_status || {};

      // Layer 1: Header + Cache TTL (optional when header card is hidden)
      const cTitleEl = document.getElementById('cTitle');
      if (cTitleEl) {
        cTitleEl.textContent = st.title + (st.archived ? ' · 已归档' : '');
      }
      const mBadgeEl = document.getElementById('mBadge');
      if (mBadgeEl) mBadgeEl.textContent = m.short || m.name;

      const ttlEl = document.getElementById('cacheTtl');
      if (ttlEl) {
        ttlEl.title = '';
        if (st.stale) {
          ttlEl.className = 'cache-ttl mono c-orange';
          ttlEl.textContent = '⚠️ 状态暂未刷新';
        } else if (ls.has_pending_bg) {
          ttlEl.className = 'cache-ttl mono c-yellow';
          ttlEl.textContent = '⏳ 后台任务/定时等待中';
        } else if (!ls.is_idle) {
          ttlEl.className = 'cache-ttl mono c-cyan';
          ttlEl.textContent = '⚡ 模型执行中...';
        } else if (ctx.compacted) {
          const ckHit = (lc && lc.prompt > 0) ? lc.pre_compact_hit_pct : null;
          const ttlTail = ls.cache_rem_sec > 0 ? ` · 预计剩余${fmtSec(ls.cache_rem_sec)}` : ' · ❄️预计已过期';
          if (ckHit != null && ckHit < 50) {
            ttlEl.className = 'cache-ttl mono c-yellow';
            ttlEl.textContent = `⚠️ 已压缩 (${fmtK(ctx.pre_compact)} → ≈${fmtK(ctx.used)} · 摘要命中${metric(ckHit, 0, '%')}${ttlTail})`;
          } else {
            ttlEl.className = ls.cache_rem_sec > 0 ? 'cache-ttl mono c-green' : 'cache-ttl mono c-dim';
            ttlEl.textContent = `🧹 已压缩 (${fmtK(ctx.pre_compact)} → ≈${fmtK(ctx.used)} · 命中${metric(ckHit, 0, '%')}${ttlTail})`;
          }
        } else if (ls.cache_rem_sec > 60) {
          ttlEl.className = 'cache-ttl mono c-green';
          ttlEl.textContent = `🔥 缓存预计有效 ${fmtSec(ls.cache_rem_sec)}`;
        } else if (ls.cache_rem_sec > 0) {
          ttlEl.className = 'cache-ttl mono c-yellow';
          ttlEl.textContent = `⏳ 缓存预计剩余 ${fmtSec(ls.cache_rem_sec)}`;
        } else {
          ttlEl.className = 'cache-ttl mono c-dim';
          ttlEl.textContent = '❄️ 缓存预计已过期';
        }
      }

      // Layer 2: 2x2 Hero KPIs
      const kpiValClass = cls => (cls === 'c-green' ? 'c-text' : cls);
      const cCls = ctxClass(ctx.pct, ctx.used, ctx.limit);
      const cValCls = kpiValClass(cCls);
      document.getElementById('heroCtxPct').className = 'kpi-val mono ' + cValCls;
      document.getElementById('heroCtxPct').textContent = (ctx.compacted ? '≈' : '') + ctx.pct.toFixed(1) + '%';
      document.getElementById('heroCtxUsed').title = ctx.limit_default ? '模型上限为默认值' : '模型上限取自请求记录';
      if (ctx.compacted) {
        document.getElementById('heroCtxUsed').innerHTML = `<strong class="${cValCls}">≈${fmtK(ctx.used)}</strong> / ${fmtK(ctx.limit)} <span class="c-green">🧹</span>`;
      } else {
        document.getElementById('heroCtxUsed').innerHTML = `<strong class="${cValCls}">${fmtK(ctx.used)}</strong> / ${fmtK(ctx.limit)}`;
      }

      const cachePctOfLimit = ctx.compacted ? 0 : Math.min(100, (lc.cache * 100) / ctx.limit);
      const inPctOfLimit = ctx.compacted
        ? Math.min(100, (ctx.used * 100) / ctx.limit)
        : Math.min(100 - cachePctOfLimit, (lc.in * 100) / ctx.limit);
      const totCtxPct = Math.min(100, cachePctOfLimit + inPctOfLimit);
      const ringCtxCacheEl = document.getElementById('ringCtxCache');
      const ringCtxInEl = document.getElementById('ringCtxIn');
      ringCtxCacheEl.setAttribute('class', 'ring-fill ' + cCls);
      ringCtxCacheEl.setAttribute('stroke-dasharray', `${cachePctOfLimit.toFixed(2)} 100`);
      ringCtxInEl.setAttribute('stroke-dasharray', `${totCtxPct.toFixed(2)} 100`);

      const hCls = hitClass(lt.hit_pct);
      document.getElementById('heroHitLatest').className = 'kpi-val mono ' + kpiValClass(hCls);
      document.getElementById('heroHitLatest').textContent = hit(lt);
      document.getElementById('heroHitCum').className = kpiValClass(hitClass(cum.hit_pct));
      document.getElementById('heroHitCum').textContent = hit(cum);
      const ringHitEl = document.getElementById('ringHit');
      ringHitEl.setAttribute('class', 'ring-fill ' + hCls);
      ringHitEl.setAttribute('stroke-dasharray', `${Math.min(100, lt.hit_pct).toFixed(1)} 100`);

      document.getElementById('heroTpsLatest').innerHTML =
        `<span class="${kpiValClass(tpsClass(lt.tps))}">${metric(lt.tps, 1, 't')}</span>`;
      document.getElementById('heroTpsAvg').className = kpiValClass(tpsClass(cum.dec_tps));
      document.getElementById('heroTpsAvg').textContent = metric(cum.dec_tps, 1, ' t/s');
      document.getElementById('heroTpsAvg').title = `全会话：${cum.streamed_calls} 次流计时，${metric(cum.tps_dur, 3, " 秒")}`;
      renderSparkBars('sparkTps', st.turns, 'tps', 200, tpsClass);

      document.getElementById('heroTtftLatest').innerHTML =
        `<span class="${kpiValClass(ttftClass(lt.ttft))}">${metric(lt.ttft, 1, 's')}</span>`;
      document.getElementById('heroTtftAvg').className = kpiValClass(ttftClass(cum.avg_ttft));
      document.getElementById('heroTtftAvg').textContent = metric(cum.avg_ttft, 1, 's');
      renderSparkBars('sparkTtft', st.turns, 'ttft', 15, ttftClass);

      // Layer 3: 2-Card Token Breakdown (Dual-Ring KPI Cards + Hover Popover)
      const ltPromptEl = document.getElementById('ltPrompt');
      if (ltPromptEl) ltPromptEl.textContent = fmtK(lt.prompt);
      document.getElementById('cumPrompt').textContent = fmtK(cum.prompt);
      document.getElementById('costPrompt').textContent = fmtUsd(cum.cost_prompt);

      const ltOutEl = document.getElementById('ltOut');
      if (ltOutEl) ltOutEl.textContent = fmtK(lt.out);
      document.getElementById('cumOut').textContent = fmtK(cum.out);
      document.getElementById('costOut').textContent = fmtUsd(cum.cost_out);

      const inTot = Number(cum.prompt || 0);
      const inCachePct = inTot > 0 ? Math.max(0, Math.min(100, (Number(cum.cache || 0) * 100) / inTot)) : 0;
      document.getElementById('ringInNew').setAttribute('stroke-dasharray', inTot > 0 ? '100 100' : '0 100');
      document.getElementById('ringInCache').setAttribute('stroke-dasharray', inTot > 0 ? `${inCachePct.toFixed(2)} 100` : '0 100');

      const outTot = Number(cum.out || 0);
      const outThinkPct = outTot > 0 ? Math.max(0, Math.min(100, (Number(cum.think || 0) * 100) / outTot)) : 0;
      document.getElementById('ringOutResp').setAttribute('stroke-dasharray', outTot > 0 ? '100 100' : '0 100');
      document.getElementById('ringOutThink').setAttribute('stroke-dasharray', outTot > 0 ? `${outThinkPct.toFixed(2)} 100` : '0 100');

      latestTokenTipData = { lt, cum, inCachePct, outThinkPct };
      if (activeTipSource && (activeTipSource.kind === 'tk_in' || activeTipSource.kind === 'tk_out')) {
        const cardEl = document.getElementById(activeTipSource.kind === 'tk_in' ? 'tkInCard' : 'tkOutCard');
        const tipHtml = buildTokenCardTipHtml(activeTipSource.kind === 'tk_in' ? 'in' : 'out');
        if (cardEl && tipHtml) showChartTip(cardEl, tipHtml, activeTipSource);
      }

      // Layer 3.5: Collapsible Models & API Cost Board (Bar Chart + Detail Card)
      const mb = st.models_board || {};
      const mSum = mb.summary || { count: 0, cost: 0 };
      const mItems = mb.items || [];
      const modelSummaryEl = document.getElementById('modelSummary');
      const modelBadgeEl = document.getElementById('modelBadge');
      const modelEmptyEl = document.getElementById('modelEmpty');
      const modelPanelNode = document.getElementById('modelPanel');

      if (!mItems.length) {
        if (!st.stale || st.models_board) {
          modelSummaryEl.textContent = '模型看板';
          modelBadgeEl.className = 'mono c-dim';
          modelBadgeEl.textContent = '--';
          modelEmptyEl.style.display = 'block';
          modelPanelNode.style.display = 'none';
          latestModelItems = [];
          setHtml(modelPanelNode, '');
        }
      } else {
        modelSummaryEl.textContent = `模型看板 (${mItems.length})`;
        modelBadgeEl.className = 'mono c-muted';
        modelBadgeEl.innerHTML = `API <strong class="c-text">${fmtUsd(mSum.cost)}</strong>`;
        modelEmptyEl.style.display = 'none';

      // Layer 4: Collapsible Per-Turn History (Header Tabs + Interactive SVG Line Chart + Hover Popover)
      document.getElementById('turnSummary').textContent = `逐轮明细 (${cum.turns})`;
      renderTurnsPanel(st.turns || []);

      // Layer 5: Collapsible Subagent Token Consumption (No total row inside list; header badge shows In, Out, Cache%, TPS)
      const subSum = st.subagents_summary || { count: 0 };

      const subSummaryEl = document.getElementById('subSummary');

      const subEmptyEl = document.getElementById('subEmpty');
      const subListEl = document.getElementById('subList');

      function renderSubRow(item, idx, maxSubTok) {
        const nameTxt = escHtml(item.label);
        const modelTxt = fmtSubModel(item.model) || '—';
        const totTok = item.metrics_unavailable ? 0 : (Number(item.prompt || 0) + Number(item.out || 0));
        const pct = maxSubTok > 0 && totTok > 0 ? Math.max(3, Math.min(100, (totTok / maxSubTok) * 100)) : 0;
        const stCls = ({running: 'st-run', error: 'st-err', killed: 'st-killed', waiting: 'st-waiting'})[item.status] || 'st-done';
        const stLbl = ({running: '运行中', error: '失败', killed: '已停止', waiting: '等待中'})[item.status] || '已完成';
        const statusHtml = `<span class="sub-dot ${stCls}" aria-label="${stLbl}" title="${stLbl}"></span>`;
        const rowCls = item.status === 'running' ? 'sub-bar-row is-running' : 'sub-bar-row';
        const subColor = modelBrandVar(`${item.model || ''} ${item.agent || ''}`);
        return `
          <div class="${rowCls}" style="--sub-color:${subColor}" data-sub-idx="${idx}" tabindex="0">
            ${pct > 0 ? `<span class="sub-bar-bg" style="width:${pct.toFixed(1)}%" aria-hidden="true"></span>` : ''}
            <div class="sub-bar-fg">
              <div class="sub-bar-left">
                ${statusHtml}
                <span class="sub-name">${nameTxt}</span>
              </div>
              <span class="sub-bar-model">${escHtml(modelTxt)}</span>
            </div>
          </div>
        `;
      }

      if (!subs.length) {
        if (!st.stale || Array.isArray(st.subagents)) {
          subSummaryEl.textContent = '子代理';
          subBadgeEl.className = 'mono c-dim';
          subBadgeEl.textContent = '未派出';
          subEmptyEl.style.display = 'block';
          subListEl.style.display = 'none';
          latestSubItems = [];
          if (activeTipSource && activeTipSource.kind === 'sub') hideChartTip();
          setHtml(subListEl, '');
        }
      } else {
        subSummaryEl.textContent = `子代理 (${subs.length})`;
        subBadgeEl.className = 'mono c-muted';
        const totSubTokens = Number(subSum.prompt || 0) + Number(subSum.out || 0);
        const subSpeedTip = Object.entries(subSum.speeds || {}).map(([k,v]) => (rateKind[k] || k) + " " + metric(v.tps, 1, " t/s")).join(" · ");
        subBadgeEl.innerHTML =
          `<strong class="c-text">${subSum.metrics_incomplete ? "≈" : ""}${fmtK(totSubTokens)}</strong> · <strong class="c-text">${fmtUsd(subSum.cost)}</strong>`;
        subBadgeEl.title = (subSum.metrics_incomplete ? "部分子代理运行中或无统计，当前为近似汇总" : "子代理合计用量与 API 费用") + (subSpeedTip ? " · " + subSpeedTip : "");
        subEmptyEl.style.display = 'none';
        subListEl.style.display = 'flex';

        latestSubItems = subs;
        const maxSubTok = subs.reduce((mx, s) => {
          if (!s || s.metrics_unavailable) return mx;
          return Math.max(mx, Number(s.prompt || 0) + Number(s.out || 0));
        }, 0);
        setHtml(subListEl, subs.map((s, idx) => renderSubRow(s, idx, maxSubTok)).join(''));
        if (activeTipSource && activeTipSource.kind === 'sub') {
          const idx = Number(activeTipSource.key);
          const rowEl = subListEl.querySelector(`.sub-bar-row[data-sub-idx="${idx}"]`);
          if (rowEl && latestSubItems[idx]) showChartTip(rowEl, buildSubTipHtml(latestSubItems[idx]), activeTipSource);
          else hideChartTip();
        }
      }
      // Layer 6: Collapsible Calendar Usage Statistics
      renderCalendar(latestCalendar);
      if (st.stale) showStatusError(Object.assign(new Error(st.error || "数据暂未更新"), { kind: 'stale' }));
    } catch (e) {
      showStatusError(e);
    } finally {
      inFlight--;
      if (refreshPending) { refreshPending = false; queueMicrotask(() => refresh()); }
    }
  }

  const siblingHealing = new WeakMap();
  function healSiblingFrames() {
    if (!iframeVisible()) return;
    try {
      if (!window.parent || window.parent === window) return;
      const frames = window.parent.frames;
      const current = new URL(window.location.href);
      for (let i = 0; i < frames.length; i++) {
        try {
          const frame = frames[i];
          if (!frame || frame === window) continue;
          const target = new URL(frame.location.href);
          if (target.protocol !== current.protocol || target.host !== current.host) continue;
          const doc = frame.document;
          if (!doc || doc.readyState !== 'complete') continue;
          if (doc.getElementById('footBar') && frame.__AGY_COCKPIT_READY && frame.__AGY_COCKPIT_UI_VERSION === UI_VERSION) continue;
          const now = Date.now();
          const state = siblingHealing.get(frame) || { attempts: 0, last: 0 };
          if (state.attempts >= 3 || now - state.last < 5000) continue;
          siblingHealing.set(frame, { attempts: state.attempts + 1, last: now });
          if (!target.searchParams.get('token') && sidecarToken) target.searchParams.set('token', sidecarToken);
          frame.location.replace(target.toString());
        } catch (_) {}
      }
    } catch (_) {}
  }

  let paneWasVisible = iframeVisible();
  function onMaybeVisible() {
    const visible = iframeVisible();
    if (visible && !paneWasVisible) refresh(true);
    paneWasVisible = visible;
  }
  window.addEventListener('resize', onMaybeVisible);
  window.addEventListener('focus', onMaybeVisible);
  document.addEventListener('visibilitychange', onMaybeVisible);
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(onMaybeVisible).observe(document.documentElement);
  }
  window.__AGY_COCKPIT_UI_VERSION = UI_VERSION;
  window.__AGY_COCKPIT_READY = true;
  healSiblingFrames();
  if (paneWasVisible) refresh(true);
  setInterval(() => {
    healSiblingFrames();
    if (iframeVisible()) refresh();
  }, 500);
</script>
</body>
</html>
